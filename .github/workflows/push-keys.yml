name: Set up push keys

# Run by hand once: Actions › "Set up push keys" › Run workflow.
# Makes the key pair phone notifications need and saves it in the owners-only
# secrets/push doc. Does nothing if keys already exist (so phones stay subscribed).

on:
  workflow_dispatch:

jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix functions --no-audit --no-fund
      - name: Make keys if missing
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          cd functions
          node -e '
            const admin = require("firebase-admin");
            const webpush = require("web-push");
            admin.initializeApp({ projectId: "camp-daniel" });
            const ref = admin.firestore().collection("secrets").doc("push");
            (async () => {
              const snap = await ref.get();
              if (snap.exists && snap.data().publicKey) { console.log("::notice::Push keys already set up. Nothing changed."); return; }
              const k = webpush.generateVAPIDKeys();
              await ref.set({ publicKey: k.publicKey, privateKey: k.privateKey, createdAt: new Date().toISOString() });
              console.log("::notice::Push keys created and saved (owners-only).");
            })().catch((e) => { console.log(`::error::${e.message}`); process.exit(1); });
          '
